sample:
  description: Power management light and deep sleep cycles on MEC ASSY6941
  name: mec_assy6941 power management
common:
  platform_allow: mec_assy6941/mec1753_qlj
  tags:
    - board
    - pm
  harness: console
  harness_config:
    type: multi_line
    ordered: false
    regex:
      - "Wake from Light Sleep"
      - "Wake from Deep Sleep"
      - "PM sample PASSED"
tests:
  sample.boards.mec_assy6941.pm: {}
  sample.boards.mec_assy6941.pm.device:
    extra_args:
      - CONF_FILE="pm-device.conf"
