# System power management with device power management: the PM core suspends
# drivers before entering a low-power state and resumes them after, so each
# driver's pm_action handles its own hardware.
#
# The console UART is suspended across the sleep, so output pauses there and
# resumes on wake.
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=y

CONFIG_LOG=y
CONFIG_THREAD_NAME=y
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=2100
CONFIG_IDLE_STACK_SIZE=512
