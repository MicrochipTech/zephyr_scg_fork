# System power management only: devices stay enabled across a low-power state
# and the MEC SoC layer masks the peripherals that ignore SLP_EN. See
# pm-device.conf for the CONFIG_PM_DEVICE variant.
CONFIG_PM=y

CONFIG_LOG=y
CONFIG_THREAD_NAME=y

# The logging thread must run less often than the shortest sleep under test, or
# it wakes the system before the residency is met.
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=2100

CONFIG_IDLE_STACK_SIZE=512
